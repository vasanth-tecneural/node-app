apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: node-app-server
  namespace: dev-dev
  labels:
    app.kubernetes.io/name: node-app-server
    app.kubernetes.io/managed-by: deepagent
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-app-server
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
