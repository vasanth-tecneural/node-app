# Generated by DeepAgent for project "dev-dev" (env "dev"). Regenerated on every deploy — edits here are overwritten; delete this line to keep the file as your own.
name: CI (build all services) · dev-dev

# Manual trigger — click "Run" in the Actions tab (or the app's CI/CD Pipelines page).
# When this workflow succeeds, the CD workflow fires automatically via workflow_run.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  build-and-push:
    name: Build and push all services
    environment: dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no stored secrets)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::411232894985:role/gha-vasanth-tecneural-node-app-node-app-client
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and tag client image
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/node-app-client
          TAG: ${{ github.sha }}
        run: |
          docker build --build-arg VITE_SERVER_URL="${{ vars.VITE_SERVER_URL }}" -t "$ECR:$TAG" -t "$ECR:latest" -f "client/Dockerfile" "client"

      - name: Scan client image for vulnerabilities (Trivy)
        continue-on-error: true
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/node-app-client
          TAG: ${{ github.sha }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            "$ECR:$TAG" || echo "::warning::Trivy flagged issues or could not run — non-blocking, see logs."
      - name: Push client image
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/node-app-client
          TAG: ${{ github.sha }}
        run: |
          docker push "$ECR:$TAG"
          docker push "$ECR:latest"

      - name: Build and tag server image
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/node-app-server
          TAG: ${{ github.sha }}
        run: |
          docker build --build-arg VITE_SERVER_URL="${{ vars.VITE_SERVER_URL }}" -t "$ECR:$TAG" -t "$ECR:latest" -f "server/Dockerfile" "server"

      - name: Scan server image for vulnerabilities (Trivy)
        continue-on-error: true
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/node-app-server
          TAG: ${{ github.sha }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.65.0 image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            "$ECR:$TAG" || echo "::warning::Trivy flagged issues or could not run — non-blocking, see logs."
      - name: Push server image
        env:
          ECR: 411232894985.dkr.ecr.us-east-1.amazonaws.com/node-app-server
          TAG: ${{ github.sha }}
        run: |
          docker push "$ECR:$TAG"
          docker push "$ECR:latest"
